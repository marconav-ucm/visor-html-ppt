<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><style>body{font-family:-apple-system,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}svg{width:60%;max-height:70vh}</style></head>
<body><svg viewBox="0 0 200 120"><rect x="20" y="80" width="160" height="14" rx="4" fill="#c9b79c"/><g id="b" style="transform-origin:100px 80px"><rect x="94" y="10" width="12" height="70" rx="5" fill="#e8dcc6" stroke="#8a7a60"/></g></svg>
<input id="r" type="range" min="-60" max="60" value="0" style="width:50%"><div id="o">0°</div>
<script>r.oninput=()=>{b.style.transform='rotate('+r.value+'deg)';o.textContent=r.value+'°'}</script></body></html>
