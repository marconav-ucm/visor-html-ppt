<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Role play: marcador de fallos por escena y por equipo</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d2430;--mut:#5b6575;--line:#d9d5ca;--blue:#0b4f8a;--blue2:#e6eef7;--t0:#0b4f8a;--t1:#c2571a;--ok:#1d7a4d;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#deck{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);transform-origin:0 0;display:flex;flex-direction:column;font-size:30px;overflow:hidden}
header{background:var(--blue);color:#fff;height:96px;flex:none;display:flex;align-items:center;padding:0 56px;gap:24px}
header h1{margin:0;font-size:46px}
header .sp{flex:1}
.hb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:8px 20px;font-size:24px}
.hb.on{background:#fff;color:var(--blue)}
.board{display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;gap:0;padding:20px 56px 8px;flex:none}
.tm{background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:12px 28px;display:flex;align-items:center;gap:26px;height:170px}
.tm.best{border-color:var(--ok);box-shadow:0 0 0 4px #c4e6d2}
.tm .dot{width:26px;height:26px;border-radius:50%;flex:none}
.tm .nm{font-size:42px;font-weight:700;outline:none;min-width:200px}
.tm .nm:focus{background:var(--blue2);border-radius:8px}
.tm .sub{color:var(--mut);font-size:24px;margin-top:4px}
.tm .big{margin-left:auto;font-size:116px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tm .big small{font-size:28px;font-weight:600;color:var(--mut);margin-left:10px}
.vs{text-align:center;white-space:nowrap;font-size:30px;color:var(--mut);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:8px 56px;flex:none}
.tab{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:8px 18px;text-align:left;height:136px;color:var(--ink);position:relative}
.tab.sel{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 3px var(--blue)}
.tab b{font-size:28px;display:block}
.tab span{font-size:22px;color:var(--mut)}
.tab .chip{display:inline-block;margin-top:6px;font-size:21px;color:#fff;border-radius:8px;padding:2px 12px}
.tab .tt{position:absolute;right:16px;top:8px;font-size:46px;font-weight:800;color:var(--ink)}
.scene{display:flex;align-items:center;gap:22px;padding:2px 56px;font-size:26px;color:var(--mut);flex:none;height:46px}
.scene b{color:var(--ink)}
.swap{background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:10px;padding:2px 14px;font-size:22px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:6px 56px 24px}
.col{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px 20px;display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 6px;font-size:32px;color:var(--blue);display:flex;align-items:center}
.col h2 .st{margin-left:auto;font-size:42px;color:var(--ink);font-variant-numeric:tabular-nums}
.it{flex:1;min-height:0;display:flex;align-items:center;gap:12px;border-top:2px solid var(--line);max-height:112px}
.it .lb{flex:1;font-size:27px;line-height:1.15;outline:none}
.it .lb[contenteditable=true]{background:#fffbe6;border-radius:6px;padding:2px 6px}
.cn{display:flex;align-items:center;gap:8px}
.cn button{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:38px;line-height:1;color:var(--ink)}
.cn .plus{background:var(--bad);border-color:var(--bad);color:#fff}
.cn .num{width:64px;text-align:center;font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}
.del{width:44px;height:44px;border-radius:10px;border:2px solid var(--bad);background:#fff;color:var(--bad);font-size:26px}
.add{margin-top:8px;border:2px dashed var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:8px;font-size:24px}
.foot{position:fixed;left:10px;bottom:8px;display:flex;gap:6px;z-index:5;opacity:.3}
.foot:hover{opacity:1}
.fb{background:#222c3a;color:#fff;border:1px solid #4a5566;border-radius:8px;padding:5px 10px;font-size:13px}
</style>
</head>
<body>
<div id="deck">
  <header>
    <h1>Role play: marcador de fallos</h1>
    <div class="sp"></div>
    <button class="hb" id="eBtn">Editar criterios</button>
  </header>
  <div class="board" id="board"></div>
  <div class="tabs" id="tabs"></div>
  <div class="scene" id="scene"></div>
  <div class="cols" id="cols"></div>
</div>
<div class="foot"><button class="fb" id="rs">Reiniciar escena</button><button class="fb" id="ra">Reiniciar todo</button></div>
<script>
"use strict";
const SC=[
 {n:"Escena 1",f:"Recibir",p:"Lucía, 34 años"},
 {n:"Escena 2",f:"Explorar",p:"Antonio, 58 años"},
 {n:"Escena 3",f:"Explicar",p:"Sara, 27 años"},
 {n:"Escena 4",f:"Cerrar",p:"Carmen, 72 años"}
];
const COL=["var(--t0)","var(--t1)"];
function fresh(){return {
  sc:0,phys:[0,1,0,1],names:["Equipo 1","Equipo 2"],nid:20,edit:false,
  parts:[
   {n:"Conexiones",it:[{id:"i1",n:"Conducta no verbal y mirada"},{id:"i2",n:"Respeto y empatía"},{id:"i3",n:"Escucha activa"}]},
   {n:"Preguntas",it:[{id:"i4",n:"Preguntas cerradas"},{id:"i5",n:"Preguntas simultáneas"},{id:"i6",n:"Preguntas capciosas"},{id:"i7",n:"Interrupciones al paciente"}]},
   {n:"Estructura",it:[{id:"i8",n:"No se cumple la fase de la escena"},{id:"i9",n:"Paso fuera de su momento"},{id:"i10",n:"No se descubre la agenda oculta"}]}
  ],
  cnt:[{},{},{},{}]
}}
let st=fresh();
try{const o=JSON.parse(localStorage.getItem("rp-marcador")||"null");if(o&&o.parts&&o.cnt)st=o}catch(e){}
function save(){try{localStorage.setItem("rp-marcador",JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ids=()=>st.parts.flatMap(p=>p.it.map(i=>i.id));
const val=(s,id)=>(st.cnt[s]&&st.cnt[s][id])||0;
const partSum=(s,p)=>p.it.reduce((a,i)=>a+val(s,i.id),0);
const sceneTot=s=>ids().reduce((a,id)=>a+val(s,id),0);
const teamTot=t=>SC.reduce((a,_,s)=>a+(st.phys[s]===t?sceneTot(s):0),0);

function render(){
  const t0=teamTot(0),t1=teamTot(1),best=t0===t1?-1:(t0<t1?0:1);
  const brk=t=>{const l=SC.map((x,s)=>st.phys[s]===t?`Esc. ${s+1}: <b>${sceneTot(s)}</b>`:null).filter(Boolean);return l.length?"Fisioterapeuta en "+l.join(" · "):"Sin escenas como fisioterapeuta"};
  const card=t=>`<div class="tm ${best===t?"best":""}"><span class="dot" style="background:${COL[t]}"></span><div><div class="nm" contenteditable="true" spellcheck="false" data-team="${t}">${esc(st.names[t])}</div><div class="sub">${brk(t)}</div></div><div class="big">${teamTot(t)}<small>fallos</small></div></div>`;
  $("board").innerHTML=card(0)+`<div class="vs">frente a</div>`+card(1);
  $("tabs").innerHTML=SC.map((x,s)=>{const t=st.phys[s];return `<button class="tab ${s===st.sc?"sel":""}" data-sc="${s}"><b>${x.n}: ${x.f}</b><span>Paciente: ${x.p}</span><br><span class="chip"  style="background:${COL[t]}">Fisioterapeuta: ${esc(st.names[t])}</span><span class="tt">${sceneTot(s)}</span></button>`}).join("");
  const s=st.sc,tp=st.phys[s];
  $("scene").innerHTML=`<span><b>${SC[s].n}</b> · Hace de fisioterapeuta: <b style="color:${COL[tp]}">${esc(st.names[tp])}</b> · Hace de paciente: <b style="color:${COL[1-tp]}">${esc(st.names[1-tp])}</b></span><button class="swap" id="swap">Intercambiar equipos</button><span>Fallos de esta escena: <b>${sceneTot(s)}</b></span>`;
  $("cols").innerHTML=st.parts.map((p,pi)=>`<div class="col"><h2>${p.n}<span class="st">${partSum(s,p)}</span></h2>`+
    p.it.map(i=>`<div class="it"><div class="lb" ${st.edit?'contenteditable="true"':''} data-ren="${i.id}" spellcheck="false">${esc(i.n)}</div>`+
      (st.edit?`<button class="del" data-del="${i.id}" title="Quitar criterio">×</button>`:`<div class="cn"><button data-m="${i.id}">−</button><div class="num">${val(s,i.id)}</div><button class="plus" data-p="${i.id}">+</button></div>`)+`</div>`).join("")+
    (st.edit?`<button class="add" data-add="${pi}">Añadir criterio</button>`:"")+`</div>`).join("");
  $("eBtn").classList.toggle("on",st.edit);$("eBtn").textContent=st.edit?"Terminar de editar":"Editar criterios";
}
function bump(id,d){const c=st.cnt[st.sc];c[id]=Math.max(0,(c[id]||0)+d);save();render()}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p)bump(b.dataset.p,1);
  else if(b.dataset.m)bump(b.dataset.m,-1);
  else if(b.dataset.sc!=null){st.sc=+b.dataset.sc;save();render()}
  else if(b.id==="swap"){st.phys[st.sc]=1-st.phys[st.sc];save();render()}
  else if(b.dataset.del){st.parts.forEach(p=>p.it=p.it.filter(i=>i.id!==b.dataset.del));save();render()}
  else if(b.dataset.add!=null){st.parts[+b.dataset.add].it.push({id:"i"+(++st.nid),n:"Nuevo criterio"});save();render()}
  else if(b.id==="eBtn"){st.edit=!st.edit;save();render()}
});
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.team!=null){st.names[+t.dataset.team]=(t.textContent.trim()||("Equipo "+(+t.dataset.team+1)));save();render()}
  else if(t.dataset&&t.dataset.ren){const txt=t.textContent.trim()||"Criterio";st.parts.forEach(p=>p.it.forEach(i=>{if(i.id===t.dataset.ren)i.n=txt}));save()}
});
document.addEventListener("keydown",e=>{
  if(e.target.isContentEditable){if(e.key==="Enter"){e.preventDefault();e.target.blur()}return}
  if(["1","2","3","4"].includes(e.key)){st.sc=+e.key-1;save();render()}
});
function confirmBtn(id,label,fn){const b=$(id);let armed=false,t;b.onclick=()=>{if(!armed){armed=true;b.textContent="¿Seguro? Pulsa otra vez";clearTimeout(t);t=setTimeout(()=>{armed=false;b.textContent=label},3000)}else{armed=false;clearTimeout(t);b.textContent=label;fn()}}}
confirmBtn("rs","Reiniciar escena",()=>{st.cnt[st.sc]={};save();render()});
confirmBtn("ra","Reiniciar todo",()=>{const k=st.parts,n=st.names,p=st.phys,nid=st.nid;st=fresh();st.parts=k;st.names=n;st.phys=p;st.nid=nid;save();render()});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),d=$("deck");d.style.transform="scale("+k+")";d.style.left=((innerWidth-1920*k)/2)+"px";d.style.top=((innerHeight-1080*k)/2)+"px"}
addEventListener("resize",fit);fit();render();
</script>
</body>
</html>
