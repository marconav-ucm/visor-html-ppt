<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aventura: banderas rojas y cola de caballo, elige tu caso</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d2430;--mut:#5b6575;--line:#d9d5ca;--blue:#0b4f8a;--blue2:#e6eef7;--red:#b3261e;--red2:#fbe4e1;--ok:#1d7a4d;--okbg:#e3f3ea;--warn:#b4561b;--warnbg:#fbeadd;--gold:#c99a12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
#deck{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);transform-origin:0 0;display:flex;flex-direction:column;font-size:30px;overflow:hidden}
header{background:var(--red);color:#fff;height:96px;flex:none;display:flex;align-items:center;padding:0 56px;gap:28px}
header h1{margin:0;font-size:42px}
header .sp{flex:1}
.pill{background:rgba(255,255,255,.18);border-radius:14px;padding:6px 20px;font-size:26px;white-space:nowrap}
.pill b{font-size:30px}
.meter{background:var(--panel);border-bottom:2px solid var(--line);height:88px;flex:none;display:flex;align-items:center;gap:16px;padding:0 56px}
.meter .lab{font-size:24px;color:var(--mut);width:190px;line-height:1.1}
.fl{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.chip{font-size:23px;border-radius:999px;padding:5px 16px;background:var(--red2);color:var(--red);border:2px solid var(--red);font-weight:700;white-space:nowrap}
.none{font-size:24px;color:var(--mut)}
main{flex:1;min-height:0;display:grid;grid-template-columns:1020px 1fr;gap:26px;padding:22px 56px 10px}
.scene{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 28px;display:flex;flex-direction:column;min-height:0}
.scene h2{margin:0 0 6px;font-size:40px;color:var(--red)}
.stage{display:flex;gap:18px;align-items:flex-end;height:200px;flex:none;margin:6px 0 4px;background:linear-gradient(#eaf1f7,#dfe7ef);border-radius:16px;overflow:hidden;padding:0 20px}
.stage svg{height:190px;flex:none}
.quote{margin:10px 0 0;border-left:10px solid var(--blue);background:var(--blue2);border-radius:10px;padding:10px 18px;font-size:26px;line-height:1.26;font-style:italic;flex:none}
.narr{font-size:27px;line-height:1.28;margin-top:10px;overflow:hidden}
.note{margin-top:auto;background:var(--warnbg);border-left:10px solid var(--warn);border-radius:10px;padding:10px 18px;font-size:25px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:11px;min-height:0;overflow:hidden}
.opts h3{margin:4px 0 0;font-size:30px;color:var(--mut)}
.opt{background:var(--panel);border:3px solid var(--blue);color:var(--ink);border-radius:18px;padding:12px 20px;text-align:left;font-size:27px;line-height:1.22;display:flex;gap:16px;align-items:center}
.opt:hover{background:var(--blue2)}
.opt .k{flex:none;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px}
.opt.go{border-color:var(--red)}.opt.go .k{background:var(--red)}
.opt.used{opacity:.4;pointer-events:none;text-decoration:line-through}
.opts.cmp{gap:7px}.opts.cmp .opt{padding:6px 16px;font-size:24px}.opts.cmp .opt .k{width:38px;height:38px;font-size:21px}.opts.cmp h3{font-size:26px;margin:0}
footer{height:90px;flex:none;display:flex;align-items:center;gap:14px;padding:0 56px 8px;justify-content:flex-end}
.fb{background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:12px;padding:8px 18px;font-size:23px}
.menu{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px;min-height:0}
.cc{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px 24px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.cc:hover{border-color:var(--red);background:#fffaf9}
.cc h2{margin:0;font-size:36px;color:var(--ink)}
.cc p{margin:0;font-size:25px;line-height:1.25;color:var(--mut)}
.cc .st{margin-top:auto;font-size:34px;color:var(--gold);letter-spacing:3px}
.cc .st i{color:#d5d5d5;font-style:normal}
.cc.tip{border-style:dashed;justify-content:center;background:transparent}
.end{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:26px;min-height:0}
.stars{font-size:70px;letter-spacing:6px;color:var(--gold)}
.stars i{color:#d5d5d5;font-style:normal}
.lesson{margin:0;padding-left:30px;font-size:26px;line-height:1.28}
.lesson li{margin:7px 0}
.card2{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px 28px;min-height:0;overflow:hidden}
.card2 h2{margin:0 0 8px;font-size:38px}
.tb{width:100%;border-collapse:collapse;font-size:24px}
.tb th,.tb td{border-bottom:2px solid var(--line);padding:6px 10px;text-align:left}
.tb th{color:var(--blue)}
.modal{position:absolute;inset:0;background:rgba(20,28,40,.7);display:none;place-items:center;z-index:9}
.modal.show{display:grid}
.modal .box{background:#fff;border-radius:22px;padding:30px 40px;width:1400px;max-height:960px;overflow:hidden}
.modal h2{margin:0 0 10px;font-size:42px;color:var(--red)}
.log{margin-top:8px;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:0}
.turn p{margin:0}
.turn .me{font-size:23px;color:var(--blue);line-height:1.2}
.turn .pt{font-size:25px;font-style:italic;background:var(--blue2);border-left:8px solid var(--blue);border-radius:8px;padding:6px 14px;margin-top:3px;line-height:1.24}
.turn:not(.cur){opacity:.6}
.turn:not(.cur) .pt{font-size:22px}
.react{font-size:24px;color:var(--warn);font-style:italic;background:var(--warnbg);border-radius:8px;padding:5px 14px}
.opts.two{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;align-content:start}
.opts.two h3{grid-column:1/-1;font-size:24px;margin:4px 0 0}
.opts.two .opt{padding:6px 14px;font-size:22px;line-height:1.15;min-height:54px}
.opts.two .wide{grid-column:1/-1;min-height:48px}
.opt.sp{border-color:var(--ok)}.opt.sp .k{background:var(--ok)}
.opts.cmp{gap:7px}
#tr{display:flex;align-items:center;gap:10px;font-size:22px;color:var(--mut)}
#tr b{color:var(--ink);width:120px}
.tb2{display:flex;gap:4px}.tb2 i{width:16px;height:30px;border-radius:4px;background:#e2e2e2;display:block}
.tb2 i.g{background:#2e9d62}.tb2 i.y{background:#e0b000}.tb2 i.r{background:#c8372d}
.claim{background:#fffbe6;border:3px solid #b8a64b;border-radius:10px;padding:10px 18px;margin-top:6px}
.claim p{margin:4px 0 0;font-size:25px;font-style:italic;line-height:1.28}
</style>
</head>

}
function walkLs(){
  const ms=missed();
  const a=["Sin confianza no hay anamnesis: el paciente se calla, contesta lo mínimo y acaba marchándose.","Las preguntas íntimas funcionan cuando antes has escuchado y las has explicado."];
  if(ms.length)a.push("Con esa persona sin colaborar, quedaron sin descubrir: "+ms.map(k=>FL[k].toLowerCase()).join(", ")+".");
  a.push("Una reclamación no sustituye al diagnóstico: el cuadro seguirá su curso sin que nadie lo haya visto.");
  return a;
}
function missed(){
  const c=C(),all={};
  Object.keys(c.a).forEach(k=>{if(c.a[k][1])all[c.a[k][1]]=1});
  return Object.keys(all).filter(k=>!S.found[k]);
}
function ask(i){
  const q=QS[i],c=C();
  if(S.asked[q.id])return;
  if(SENS.includes(q.id)&&!S.intro){S.pend=i;S.screen="sens";render();return}
  S.asked[q.id]=1;
  S.back="int";
  if(SENS.includes(q.id)){
    const early=QS.filter(x=>x.g==="Dolor actual"&&S.asked[x.id]).length;
    if(early<2&&!S.early){S.early=1;bump(-1,"Parpadea. Ha cambiado de tema muy deprisa.")}
  }
  let r=c.a[q.id]||DEF[q.id]||["Sin novedades.",""];
  const sens=SENS.includes(q.id)||q.id==="bl";
  if(r[1]&&((sens&&S.trust<=3)||(S.trust<=2&&q.id!=="loc"&&q.id!=="evo"))){
    S.hidden.n=1;r=[EVA[(Object.keys(S.asked).length)%EVA.length],""];
  }
  const warmth=!r[1]&&S.trust>=7&&c.a[q.id]?"":"";
  if(r[1])S.found[r[1]]=1;
  S.log.push({q:q.q,a:r[0]});
  if(r[1]&&sens&&S.trust>3){S.rx={ctx:"disc"};S.screen="rx";if(!chk())render();return}
  if(!chk())render();
}
function exam(i){
  const q=EX[i],c=C();
  if(S.asked[q.id])return;
  if(!S.exin){S.screen="exin";render();return}
  if(q.id==="per"&&S.trust<=3){S.log.push({q:q.q,a:"Prefiero que no. No me siento a gusto con eso."});S.react="Se tapa con los brazos.";render();return}
  S.asked[q.id]=1;
  S.back="exam";
  const r=c.a[q.id]||DEF[q.id];
  if(r[1])S.found[r[1]]=1;
  S.log.push({q:q.q,a:r[0]});
  render();
}
function afterDecision(){
  const c=C(),d=S.act-c.correct;
  if(d<0){S.screen="review";render()}else finish(d===0?"ok":"over");
}
function finish(kind){
  const c=C(),d=S.act-c.correct;let e;
  if(kind==="ok")e={ti:"Decisión acertada",st:3,tx:c.ok};
  else if(kind==="over")e={ti:d===1?"Seguro, pero de más":"Derivación excesiva",st:d===1?2:1,tx:c.ovr};
  else if(kind==="late")e={ti:"Rectificar a tiempo cuenta, pero no es lo mismo",st:Math.max(0,2+d),tx:c.late};
  else e={ti:"El cuadro avanza",st:0,tx:c.bad};
  if(S.comm&&!S.comm.ok)e.st=Math.max(0,e.st-1);
  S.end=e;S.screen="end";
  const prev=S.done[c.id];if(prev===undefined||e.st>prev)S.done[c.id]=e.st;
  save();render();
}
